name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate:ci

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-ubuntu
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .build/validation/**/*.log
            .build/validation/**/report.json
            .build/validation/latest.json

  windows-build:
    runs-on: windows-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Validate platform builds
        run: npm run validate -- --profile windows

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-windows
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .build/validation/**/*.log
            .build/validation/**/report.json
            .build/validation/latest.json
