name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Release tag ${{ github.ref_name }} does not match package version v$packageVersion"
          }

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Workflow replay eval
        run: npm run test:evals:replay

      - name: MCP contract baseline
        run: npm run test:mcp:contracts

      - name: Build Electron + Renderer
        run: npm run build:electron && npm run build:renderer

      - name: Package (NSIS + Portable)
        run: npx electron-builder --win nsis portable --publish never

      - name: Verify latest.yml names packaged files without whitespace
        shell: pwsh
        run: |
          $latest = Get-Content release/latest.yml -Raw
          if ($latest -notmatch '(?m)^path:\s*"?([^"\r\n]+?)"?\s*$') {
            throw "release/latest.yml has no path entry"
          }
          $installer = $Matches[1]
          foreach ($name in @($installer, "$installer.blockmap")) {
            if ($name -match '\s') {
              throw "'$name' contains whitespace; GitHub renames such assets and electron-updater downloads the hyphenated name"
            }
            if (-not (Test-Path (Join-Path 'release' $name))) {
              throw "latest.yml points at '$name', which is not in release/"
            }
          }

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
